# 부트스트랩 단계: 아직 엔티티/마이그레이션이 없어 컨텍스트 로딩만 검증한다.
# 실제 스키마(specs/0002-data-model.md)가 생기면 Testcontainers 등으로 실제 PostgreSQL 대상 테스트로 전환한다.
spring:
  datasource:
    url: jdbc:h2:mem:server-test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  ai:
    # src/test/resources/application.yml은 src/main/resources/application.yml을 완전히
    # 대체한다(합쳐지지 않음) — 그래서 chat 외 서브모델을 끄는 설정을 여기도 똑같이 둬야 한다.
    # (S-25-C, 2026-07-27 — 이 설정이 없으면 OPENAI_API_KEY 없는 테스트 환경에서 컨텍스트 자체가 안 뜬다.)
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # api-key를 일부러 두지 않는다. 예전에는 `${OPENAI_API_KEY:}`였는데, 그러면 개발자 셸의
      # 환경변수(README가 setx로 넣으라고 안내한다)가 테스트로 새어들어와
      # OpenAiConfig의 @ConditionalOnProperty가 AiTaggingClient 빈을 만들고
      # 테스트가 실제 LLM API를 호출한다 — 돈이 나가고, "AI 없을 때 폴백"을 검증하는
      # 테스트가 키를 가진 머신에서만 깨진다(CI엔 키가 없어 영영 안 잡힌다).
      # 프로퍼티 자체를 없애야 빈이 확실히 생성되지 않는다.
      #
      # 아래 두 값은 main 쪽과 **일부러 같게 유지한다** — 다르면 "테스트가 뭘로 돌았나"를
      # 볼 때 오해가 생긴다. 다만 네트워크를 타지 않으므로 값 자체는 테스트 결과에 영향이 없다.
      base-url: https://api.openai.com/v1/
      chat:
        options:
          model: gpt-5.4-nano
        completions-path: chat/completions

# 이 파일이 src/main/resources/application.yml을 완전히 대체하므로 여기에도 둬야 한다.
# 테스트는 실제 AI 서버를 부르지 않는다(클라이언트를 가짜로 대체) — 빈 생성에 필요한 값일 뿐이다.
modi:
  ai-server:
    base-url: http://localhost:8000
    internal-key: ""
    read-timeout-seconds: 5
  archive:
    instagram:
      # 값 자체는 테스트에서 안 쓴다(네트워크를 안 탄다) — InstagramUrlCrawler 빈이 뜨는 데만 필요하다.
      # 없으면 @Value 가 못 풀어 **컨텍스트 전체가 안 뜬다**(위 주석의 "여기에도 둬야 한다"가 그 뜻이다).
      doc-id: "0"

# 같은 이유로 여기에도 둔다 — FeedbackNotifier 의 @Value 가 못 풀면 컨텍스트가 안 뜬다(#70).
# 실주소를 쓰지 않는다: 테스트가 실수로 진짜 발송 경로를 타더라도 팀 메일함으로 가지 않게.
feedback:
  notify-to: team@example.test
