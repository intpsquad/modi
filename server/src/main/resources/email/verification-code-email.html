  MODI 이메일 인증코드 메일 템플릿 (QA, 2026-08-05)

  ⚠️ 이 파일은 프론트/디자인이 만든 "핸드오프용 디자인 원본"이다.
  실제 발송은 서버(Spring EmailSender/SMTP)가 하므로, 백엔드가 아래를 적용해야 한다:
    1) 메일을 text/plain 이 아니라 text/html 로 보낸다
       (Spring: `MimeMessageHelper(message, ...); helper.setText(html, true);`)
    2) 아래 본문의 플레이스홀더를 실제 값으로 치환한다:
         {{CODE}}            → 6자리 인증코드
         {{EXPIRE_MINUTES}}  → 코드 유효시간(분). 현재 정책 = 5 (specs/0002)
       치환은 단순 String.replace 로도 되고, Thymeleaf 를 쓰면 th:text 로 바꿔도 된다.
    3) 접근성/폴백을 위해 text/plain 대체본도 함께 넣길 권장(멀티파트).

  이메일 클라이언트 호환을 위해 의도적으로: 테이블 레이아웃 + 인라인 스타일 + 웹폰트 미사용
  (Gmail/Outlook 등은 <style> 태그·외부 CSS·flex/grid 를 제한적으로만 지원).
  색은 specs/design.md 토큰을 인라인으로 수동 미러링: primary #FF385C, ink #222222,
  muted #6A6A6A, border #DDDDDD, surface-soft #F7F7F7.
-->
