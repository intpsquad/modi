spring:
  application:
    name: server
  lifecycle:
    # 🔴 graceful shutdown 이 in-flight 요청을 끝낼 수 있는 시간(아래 server.shutdown 과 한 쌍).
    #
    # ⚠️ **`deploy/docker-compose.app.yml` 의 `stop_grace_period` 가 이 값보다 커야 한다.**
    # 작으면 Docker 가 그 시간에 SIGKILL 을 보내 graceful shutdown 이 끝나기 전에 프로세스를
    # 죽인다 — 설정은 있는데 효과가 없는 상태가 되고, 로그에도 아무 흔적이 없다.
    # `BlueGreenDeployContractTest` 가 두 파일의 숫자를 읽어 대소를 묶는다.
    #
    # 30초 근거: 가장 긴 요청이 아카이브 등록(외부 크롤링 + LLM)인데 그쪽은 비동기 executor 로
    # 넘어가고, 동기로 남는 것 중 최장은 이미지 presigned URL 발급·DB 트랜잭션 수준이다.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/modi}
    username: ${SPRING_DATASOURCE_USERNAME:modi}
    password: ${SPRING_DATASOURCE_PASSWORD:modi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # 방 대표 이미지 업로드(POST /rooms/cover-image). 기본값(1MB)으로는 폰 사진이
      # 바로 거절돼 RoomCoverImageService.MAX_FILE_SIZE_BYTES(5MB)와 맞춘다. 여유를 조금 둬 톰캣 상한이
      # 서비스 검증보다 먼저 걸리지 않게 max-request-size는 소폭 더 크게 잡는다(멀티파트 경계 오버헤드).
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  mail:
    # 이메일 자체가입 인증코드 발송(SMTP).
    #
    # **host는 일부러 여기 선언하지 않는다.** EmailConfig가 @ConditionalOnProperty(spring.mail.host)로
    # EmailSender 빈을 만드는데, 기본값을 주면 이 프로퍼티가 항상 존재해 조건이 항상 참이 된다 —
    # 크리덴셜 없는 환경에서 "발송 API만 503"이 아니라 예상치 못한 동작으로 갈릴 수 있다
    # (minio.endpoint 부팅 사고와 동형, specs/OPEN.md 참고). username/password도 host와 함께 있을
    # 때만 의미가 있으므로 같은 이유로 기본값을 두지 않는다 — 전부 환경변수(SPRING_MAIL_HOST 등)로만
    # 준다. port/인증 방식은 크리덴셜과 무관해 기본값을 둬도 안전하다.
    #   로컬/운영: SPRING_MAIL_HOST=smtp.gmail.com, SPRING_MAIL_USERNAME/PASSWORD(Gmail 앱 비밀번호)
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    # spring-ai-starter-model-openai의 자동설정(OpenAiChatAutoConfiguration 등)은 전부 끈다 —
    # 키가 없으면 빈 생성 시점에 곧바로 예외를 던져 컨텍스트 자체가 안 뜬다(실측 확인, 2026-07-27).
    # 대신 global.config.OpenAiConfig가 FirebaseConfig와 동일한 패턴으로 OpenAiApi/ChatClient를
    # 직접 만들어 @ConditionalOnProperty(spring.ai.openai.api-key)로 감싼다 — 키 없으면 그 빈
    # 자체가 생성되지 않고, ArchiveItemService는 태그 없이 등록을 계속 진행한다(specs/OPEN.md 확정).
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # 아래 값들은 OpenAiConfig가 @Value로 직접 읽어 쓴다(Spring AI 자동설정은 사용하지 않음).
      #
      # 🔴 2026-08-13: 게이트웨이 경유에서 **OpenAI 직접 호출**로 바꿨고, 회수된 게이트웨이의
      # 이름을 딴 키 환경변수도 이 이름으로 개명했다. 담기는 값은 OpenAI 플랫폼 키(sk-...)다.
      #
      # ⚠️ **이 이름을 또 바꿀 때는 운영 .env 를 같은 배포에서 함께 바꿔야 한다.** 어긋나면
      # 값이 안 들어와도 부팅은 성공하고 AI 기능만 조용히 꺼진다 — 위 @ConditionalOnProperty
      # 설명대로 빈 문자열에도 빈이 만들어지기 때문이다. 로그에 아무 흔적이 남지 않는다.
      api-key: ${OPENAI_API_KEY:}
      # ${...} 로 감싼 이유: 완화 바인딩(SPRING_AI_OPENAI_BASE_URL → 이 키)에 의존하지 않고
      # 덮어쓰기 경로를 눈에 보이게 두려는 것이다. 제공사 교체는 .env 한 줄로 끝난다.
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com/v1/}
      chat:
        options:
          # 태깅 모델. **요약·추천과 같은 값이다**(2026-08-13 통일, EXPERIMENTS #34).
          # 원래 gpt-5-nano였고 그 근거는 게이트웨이 크레딧 등급이었다 — 게이트웨이가 사라지면서 근거도 사라졌다.
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-5.4-nano}
        completions-path: chat/completions
      embedding:
        # 자료 임베딩. 모델은 modi.archive.embedding-model 에 있다 — 요약 모델과 같은
        # 자리에 두는 편이 "아카이브 파생 데이터를 뭐로 만드는가"를 한눈에 보기 좋아서다.
        embeddings-path: embeddings

minio:
  # 프로필 사진 등 이미지 업로드.
  #
  # **endpoint는 일부러 여기 선언하지 않는다.** MinioConfig가 @ConditionalOnProperty(minio.endpoint)로
  # ObjectStorage 빈을 만드는데, 기본값을 주면 이 프로퍼티가 항상 존재해 조건이 항상 참이 된다 —
  # MinIO가 없는 환경에서 "업로드만 503"이 아니라 **부팅 자체가 깨진다**(2026-07-29 실측:
  # 컨텍스트 초기화 실패 + okhttp 논데몬 스레드가 JVM을 붙잡아 컨테이너는 Up인데 8080은 안 열리는
  # 좀비 상태 → restart 정책도 안 걸린다).
  #
  # **public-base-url도 여기 선언하지 않는다** — 기본값이 `${minio.endpoint}`라 MinioConfig의
  # @Value 안에 두어야 한다(여기 두면 endpoint가 없는 환경에서 플레이스홀더가 안 풀려 부팅이 깨진다).
  # 기기가 이미지를 받아갈 주소이고, 서버가 접속하는 주소와 **로컬에서만 갈린다**
  # (서버 localhost:9000 ↔ 안드로이드 에뮬레이터 10.0.2.2:9000). 상세는 server/.env.example.
  #
  # firebase.credentials-path와 같은 패턴이다 — 환경변수 MINIO_ENDPOINT를 주면 Spring 완화 바인딩이
  # minio.endpoint로 읽어 빈이 생성되고, 안 주면 빈이 없어 업로드 API만 503이 된다.
  #   로컬:   MINIO_ENDPOINT=http://localhost:9000       (server/docker-compose.yml의 minio 서비스)
  #   배포:   MINIO_ENDPOINT=https://storage.maramodi.cloud  (deploy/docker-compose.app.yml)
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:modi}

modi:
  kakao:
    user-info-url: https://kapi.kakao.com/v2/user/me
    connect-timeout-seconds: 5
    read-timeout-seconds: 10
  archive:
    # 자료 AI 요약 모델. **2026-08-13부터 태깅·추천과 같은 값이다** — 원래는
    # 태깅(gpt-5-nano)과 일부러 달랐고, 그 차이를 정당화한 유일한 축이 게이트웨이 크레딧 등급이었다.
    # 게이트웨이가 회수되면서 그 축이 사라졌으므로 셋을 한 모델로 합쳤다(EXPERIMENTS #34).
    # 통일 방향이 gpt-5-nano가 아니라 gpt-5.4-nano인 근거가 바로 아래 실측이다.
    #
    # 모델 비교 실측 (2026-07-30, ai/docs/EXPERIMENTS.md #14 — 프롬프트 v1 기준):
    #   gpt-5-nano     12.9~23.9초 · completion 1,597~3,637 tok (그중 94~97%가 숨은 추론 토큰)
    #   gpt-4.1-mini    1.5~2.6초  · completion    52~  101 tok
    #   gpt-5.4-nano    1.3~2.8초  · completion    76~  144 tok  ← 채택 (추론 0)
    # gpt-5.4-nano가 gpt-4.1-mini만큼 빠르면서 nano 등급 크레딧을 유지하고, 고유명사 보존은
    # 셋 중 가장 풍부했다(사근진해변·최일순 짬뽕순두부·뚝섬역 등). 이 요약이 추천의 입력이라
    # 고유명사 보존이 핵심 품질 축이다.
    #
    # ⚠️ 위 숫자는 **프롬프트 v1** 로 낸 것이다. 코드의 프롬프트는 그 뒤 v3까지 갔고 그 실측은 #15에
    # 있다(completion 57~133 · 요약 88~157자). 모델 결론은 그대로 유효하다 — gpt-5-nano 의 추론 토큰
    # 낭비는 프롬프트가 아니라 모델의 성질이다.
    #
    # ⚠️ 옛 게이트웨이 크레딧 축(EXPERIMENTS #7)은 더 이상 적용되지 않는다 — 이제 OpenAI 플랫폼에
    # 실제 달러로 청구되고, 청구는 **출력 토큰**이 지배한다. 추론 모델을 쓰면 숨은 추론 토큰까지
    # 출력으로 과금되므로 위 표의 completion 차이가 곧 비용 차이다.
    # 비용이 예상보다 늘면 여기를 의심할 것: ARCHIVE_SUMMARY_MODEL 로 재빌드 없이 바꿀 수 있다.
    summary-model: ${ARCHIVE_SUMMARY_MODEL:gpt-5.4-nano}
    # 자료 임베딩 모델. 추천 자료 선별(RAG 2단계)이 읽을 벡터를 만든다.
    #
    # text-embedding-3-small 인 이유: AI 서버(ai/src/modi_ai/embeddings.py)가 후보 의미 중복 제거에
    # 쓰는 모델과 **같은 모델이어야 한다**. 다른 모델로 만든 벡터끼리는 코사인 유사도가 의미를 갖지
    # 않는다(같은 좌표계가 아니다). 지금은 쓰는 쪽이 갈라져 있지만, 선별을 FastAPI 가 하기로 확정된
    # 이상 언젠가 같은 공간에서 비교하게 된다 — 그때 조용히 어긋나지 않도록 여기서 맞춰 둔다.
    #
    # ⚠️ 이 값을 바꾸면 차원이 달라질 수 있고, 이미 저장된 벡터는 백필하지 않는 한 옛 모델 것으로
    # 남는다(V7 주석 참고 — real[] 에는 차원 제약이 없다).
    embedding-model: ${ARCHIVE_EMBEDDING_MODEL:text-embedding-3-small}
    # 기존 자료(V7 이전 등록분)에 임베딩을 채운다. **기본 꺼짐** — 자료 1건당 LLM 호출 1회라
    # 크레딧을 쓰고, 한 번만 필요한 작업이라 부팅마다 돌 이유가 없다.
    # 켜는 법: ARCHIVE_BACKFILL_EMBEDDINGS=true 로 한 번 기동한 뒤 다시 끈다.
    # 중간에 멈춰도 남은 것부터 이어서 하면 되므로 여러 번 켜도 안전하다(NULL 인 것만 채운다).
    backfill-embeddings: ${ARCHIVE_BACKFILL_EMBEDDINGS:false}
    # 기존 자료(요약 기능 이전 등록분)에 요약을 채우고 **그 요약으로 벡터를 다시 만든다.**
    # **기본 꺼짐** — 자료 1건당 LLM 호출 2회(요약+임베딩)라 위와 같은 이유로 켜서 쓴다.
    # ⚠️ 위 backfill-embeddings 로는 이 문제를 못 고친다 — 그쪽은 벡터가 NULL 인 것만 찾는데,
    # 요약 없이 등록된 자료는 이미 '본문으로 만든' 벡터를 갖고 있어 건너뛴다.
    # 켜는 법: ARCHIVE_BACKFILL_SUMMARIES=true 로 한 번 기동한 뒤 다시 끈다.
    backfill-summaries: ${ARCHIVE_BACKFILL_SUMMARIES:false}
    # LLM 호출(태깅·요약 공통) read 타임아웃. connect 는 5초 고정.
    #
    # **없으면 무한 대기다** — Spring AI 기본 RestClient 의 Java 21 요청 팩토리에는 타임아웃이 없어서
    # 게이트웨이가 응답 없이 멈추면 톰캣 스레드가 영구 점유된다(2026-07-30 리뷰 지적).
    # modi.ai-server.read-timeout-seconds 와 같은 값으로 맞췄다 — "외부 호출엔 타임아웃을 건다"는
    # 이 저장소의 기준(AiServerConfig)을 따른다.
    ai-read-timeout-seconds: ${ARCHIVE_AI_READ_TIMEOUT_SECONDS:60}
    # 🔴 크롤 대상이 우리를 막았다고 확인한 뒤, 그 사이트를 **얼마나 안 부를지**.
    #
    # 2026-08-05 실측: 운영 IP 가 인스타에서 소프트 블록됐는데 코드가 그걸 기억하지 않아서,
    # 다음 공유가 와도 똑같이 4번(부트스트랩·GraphQL × 재시도) 때렸다. 얻는 것은 0이고
    # 데이터센터 IP 의 호출이 누적되면 차단이 길어지므로 스스로 회복을 늦췄다.
    #
    # 10분의 근거: 차단이 영구가 아니라 10~20분 주기로 켜지고 꺼진다(운영 DB 실측 —
    # 12:45 실패 → 12:54 성공, 15:18 실패 → 15:36 성공). 실패가 뭉친 구간의 간격은 2~16분이었다.
    # ⚠️ **관측 2건에서 나온 값이다.** 실제 회복 시간이 더 쌓이면 그 근거로 고친다.
    block-cooldown: ${ARCHIVE_BLOCK_COOLDOWN:PT10M}
    instagram:
      # 인스타 공개 게시물 크롤링에 쓰는 persisted query id(PolarisPostRootQuery).
      #
      # ⚠️ **인스타가 몇 주~몇 달마다 바꾼다.** 만료 증상은 "200인데 items 가 빈 배열" 이고,
      # 사용자에게는 "공개된 게시물만 등록할 수 있어요" 로 보인다 — 즉 **조용히 인스타만 실패한다.**
      # 갱신 절차는 specs/OPEN.md 에 적어뒀다. 키가 아니라 공개 상수라 여기 기본값으로 둔다.
      #
      # 마지막 확인: 2026-08-03
      doc-id: ${ARCHIVE_INSTAGRAM_DOC_ID:26713194205046842}
      # 인스타 웹 주소. **테스트가 루프백 서버를 가리키려고 뺀 이음매**이고 운영에서 바꿀 일이 없다
      # (youtube.api-url · naver.place-url 과 같은 패턴). 로그인 응답 → 재부트스트랩 재시도는
      # 실제 HTTP 왕복 없이는 검증할 방법이 없어서 이 한 줄이 필요하다.
      # ⚠️ supports() 는 여전히 instagram.com 호스트만 받는다 — 사용자 입력으로는 못 바꾼다.
      base-url: ${ARCHIVE_INSTAGRAM_BASE_URL:https://www.instagram.com}
    youtube:
      # YouTube Data API v3 키(2026-08-05). **HTML 스크래핑을 대체한 것이지 보조가 아니다** —
      # 운영 EC2(데이터센터 IP)에서 youtube.com/watch 가 302 로 구글 CAPTCHA(google.com/sorry)에
      # 걸려 유튜브 링크 저장이 100% 실패했다. 같은 EC2 에서 이 API 는 200 이다(YouTubeUrlCrawler).
      #
      # ⚠️ **비면 유튜브 링크만 등록에 실패한다**(다른 사이트는 멀쩡하다). 그 경우 로그에
      # "YOUTUBE_API_KEY 가 설정되지 않아…" 가 error 로 남는다 — 조용히 실패하지 않는다.
      #
      # ⚠️ 운영은 EC2 .env 에 값을 넣는 것만으로 부족하다. **docker-compose.app.yml 의 spring
      # 서비스 environment 에 YOUTUBE_API_KEY 를 통과시켜야** 컨테이너 안으로 들어간다.
      #
      # 키 제한은 "API 제한 = YouTube Data API v3 만"이고 **애플리케이션(IP) 제한은 일부러 없다** —
      # 걸면 로컬에서 이 경로를 검증할 수 없어 "로컬은 되고 운영은 안 되는" 구도가 다시 생긴다
      # (2026-08-05 사용자 확정). 유출 시 피해는 하루 10,000 유닛 쿼터 소진이고 키 교체로 복구된다.
      api-key: ${YOUTUBE_API_KEY:}
      # 테스트가 루프백 서버를 가리키려고 프로퍼티로 빼뒀다 — 덕분에 crawl() 전체를 인터넷 없이 돈다
      # (2026-08-04 교훈: 파싱부만 테스트하면 응답을 꺼내는 이음매는 아무도 안 본다).
      api-url: ${YOUTUBE_API_URL:https://www.googleapis.com/youtube/v3/videos}
      # 동기 등록(S-25-C)에서 사용자를 붙잡는 경로라 LLM 호출(60초)보다 짧게 잡는다 —
      # 메타데이터 조회가 길 이유가 없다.
      connect-timeout-seconds: ${YOUTUBE_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${YOUTUBE_READ_TIMEOUT_SECONDS:10}
    naver:
      # 네이버 지도 앱 공유 링크(naver.me) 등록(2026-08-05, NaverUrlCrawler).
      #
      # **새 시크릿이 없다** — 네이버는 장소를 place id 로 조회하는 공식 API 가 없어서(검색 API 는
      # 키워드 검색만 된다) 모바일 장소 페이지를 읽는다. 그래서 .env·compose 에 추가할 것이 없다.
      #
      # ⚠️ 아래 셋은 **테스트가 루프백 서버를 가리키려고** 뺀 값이다. 운영에서 바꿀 일이 없다.
      short-url-host: ${NAVER_SHORT_URL_HOST:naver.me}
      place-url: ${NAVER_PLACE_URL:https://m.place.naver.com/place}
      # 🔴 **보안 경계다.** 단축 주소는 발급자가 어디로든 보낼 수 있어서, 펼친 목적지의 호스트를
      # 여기서 잠근다. 이게 없으면 이 크롤러가 일반 크롤러의 "리다이렉트 미추종"을 우회하는
      # 통로가 된다(specs/0001-architecture.md 의 SSRF 방어). **넓히지 말 것.**
      allowed-hosts: ${NAVER_ALLOWED_HOSTS:naver.com,naver.me}
  ai-server:
    # 투두 추천(S-16-B) 전용 FastAPI 서버. 외부에 노출하지 않고 이 서버만 호출한다(ai/CLAUDE.md).
    # 도커로 함께 띄울 때는 서비스명(예: http://ai:8000)으로 바꾼다.
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    # AI 서버와 같은 환경변수 이름을 쓴다 — 값 하나로 양쪽이 맞는다. 비면 헤더를 붙이지 않고,
    # AI 서버도 비어 있으면 검증을 건너뛰므로 로컬에서는 설정 없이 동작한다.
    internal-key: ${INTERNAL_API_KEY:}
    # ⚠️ 아래 "7~9초"는 자료 2건일 때 값이라 지금 규모를 대변하지 않는다 — 자료가 40건 넘는 방은
    # 그보다 훨씬 길다. 60초 상한은 그래서 여유가 아니라 아슬아슬하다. 어느 구간이 먹는지는
    # TodoSuggestionService 의 구간 로그로 본다.
    # 실측 7~9초(자료 2건, ai/docs/EXPERIMENTS.md #10). 아카이브가 늘면 길어지므로 잠정값이다.
    read-timeout-seconds: 60
  todo:
    suggestion:
      # 이미 노출한 후보를 프롬프트의 excluded_todos 로 보낼 것인가.
      # 🔴 false 가 기본이다 을 **의도적으로** 되돌린 것이고 버그가 아니다.
      # 회차가 갈수록 후보가 줄던 원인(부산 7.00 → 4.80 → 3.40, 동결 스냅샷 #26)이 이 목록이라,
      # "매번 6~8개"가 요구사항이 되면서 껐다. 상세는 TodoSuggestionPayloadLoader.excludeRecent.
      exclude-recent: ${TODO_SUGGESTION_EXCLUDE_RECENT:false}

server:
  # 🔴 **무중단 배포의 전제다**(2026-08-13). 기본값 `immediate` 는 SIGTERM 을 받는 즉시 톰캣을
  # 멈춰 **처리 중이던 요청을 그냥 끊는다.** 배포마다 그 순간의 요청이 실패하는데, 클라이언트는
  # 커넥션이 끊긴 것만 보고 서버 로그에는 아무 것도 안 남아 있어 "가끔 실패한다"로만 보인다.
  #
  # `graceful` 은 ① 새 커넥션 수락을 멈추고 ② 진행 중인 요청을 위 spring.lifecycle 의
  # timeout-per-shutdown-phase 까지 기다린 뒤 ③ 종료한다. blue/green 전환에서 옛 색을 세울 때
  # 이 동작이 있어야 "무중단"이 성립한다 — Caddy 가 이미 새 색으로 트래픽을 돌린 뒤라도
  # 옛 색에는 아직 응답을 만들고 있던 요청이 남아 있다.
  shutdown: graceful
  # Caddy(리버스 프록시) 뒤에 있으므로 X-Forwarded-* 를 신뢰해 실제 클라이언트 IP·프로토콜을
  # 복원한다. 이게 없으면 Spring 이 요청을 http 로 알고 리다이렉트 Location 이나 springdoc 의
  # servers URL 을 `http://` 로 만들어 HTTPS 사이트에서 깨진다(실측: /docs 는 302 를 낸다).
  # 액세스 로그는 붙이지 않는다 — Caddy 가 이미 요청 단위로 남기고 있고, 트레이싱이 필요해지면
  # 액세스 로그가 아니라 텔레메트리(OpenTelemetry 등)를 붙이는 쪽이 맞다(2026-07-30 확정).
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # 🔴 **이 지표가 스스로 장애를 만들었다**(2026-08-05 실측).
      #
      # Spring 의 `MailHealthIndicator` 는 헬스체크마다 SMTP 서버에 **실제로 로그인(AUTH)** 한다.
      # docker healthcheck 간격이 10초라 하루 8,640회 Gmail 에 로그인했고, Gmail 이 막았다:
      #
      #   jakarta.mail.AuthenticationFailedException:
      #   454-4.7.0 Too many login attempts, please try again later.
      #
      # 그래서 mail DOWN → `/actuator/health` 503 → **배포가 헬스체크 초과로 실패**했다.
      # 더 나쁜 것은 그 차단 동안 **실제 인증코드 발송도 실패**했다는 것이다 — 이메일 회원가입이
      # 조용히 망가져 있었고 알림은 없었다.
      #
      # 끄는 판단의 근거: 이 지표가 주는 정보는 "지금 SMTP 에 로그인이 되나"인데, 그건 **실제로
      # 발송할 때 알면 되는 것**이다(`EmailSender` 가 실패를 로그로 남긴다). 그걸 미리 알려고
      # 10초마다 로그인하는 대가가 계정 차단이면 남는 장사가 아니다.
      enabled: false
  endpoint:
    health:
      # 🔴 **원격에서 원인을 알 수 없어서 켰다**(2026-08-05 실제 사고).
      #
      # 기본값 never 는 `{"status":"DOWN"}` 만 주고 **어느 지표가 DOWN 인지 안 알려준다.**
      # 지표별 경로(`/actuator/health/db` 등)도 404 로 막는다. 배포가 헬스체크로 실패했을 때
      # EC2 에 들어가서도 원인을 못 짚었다 — 다섯 지표를 다 물어봤고 전부 404 였다.
      #
      # 외부 노출은 **Caddy 가 막는다** — `deploy/Caddyfile` 이 `/actuator` 와 `/actuator/*` 를
      # 404 로 응답한다. actuator 는 내부 네트워크 전용이므로 상세를 켜도 새 나가지 않는다.
      # ⚠️ Caddyfile 의 그 규칙을 지우면 이 설정이 내부 정보를 공개하게 된다 — 함께 봐야 한다.
      show-details: always
      group:
        # 🔴 **배포 게이트 전용 그룹.** `docker-compose.app.yml` 의 spring healthcheck 가 이걸 본다.
        #
        # 왜 전체 health 가 아닌가: 전체는 `mail`·`ssl` 처럼 **앱이 요청을 처리하는 데 필요하지
        # 않은 것**까지 포함한다. 그래서 SMTP 가 잠깐 안 되면 앱은 멀쩡한데 `/actuator/health` 가
        # 503 을 주고 **배포가 실패한다** — 2026-08-05 에 실제로 그렇게 막혔다(앱은 요청을 정상
        # 처리하며 로그를 찍고 있었다).
        #
        # 여기 넣는 것은 "이게 없으면 앱이 제 일을 못 한다"인 것만이다. 부가 기능의 장애가
        # 배포를 막아서는 안 되고, 그건 배포 게이트가 아니라 모니터링이 볼 일이다.
        #
        # ⚠️ 그룹 이름을 바꾸면 compose 의 healthcheck URL 도 함께 바꿔야 한다 — 어긋나면 404 가
        # 되고 `curl -fsS` 가 실패해 **모든 배포가 실패한다.** `ActuatorHealthGroupTest` 가 묶는다.
        deploy:
          include: db, redis, ping
