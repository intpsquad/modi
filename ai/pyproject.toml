[project]
name = "modi-ai"
version = "0.1.0"
description = "modi AI 서버 — 투두 추천(S-16-B)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "openai>=1.60",
    # `langchain` 풀 패키지는 쓰지 않는다 — 필요한 것만 명시적으로 넣는다(docs/DECISIONS.md).
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    # 추천 파이프라인 그래프. **기능 이득은 0이고 팀 역량 판단이다** —
    # 근거·한계는 docs/DECISIONS.md "LangGraph 도입" 항목.
    "langgraph>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]
# LangGraph Studio. **`dev` 와 분리한 이유는 무게다** — 패키지가 34개
# 늘어난다(grpcio-tools·opentelemetry 일습). CI 는 `dev` 만 설치하면 되고, Studio 를 볼
# 사람만 `uv sync --group studio` 한다. 운영 이미지는 `--no-dev` 라 어느 쪽도 안 들어간다.
studio = [
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modi_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# `evals` 는 여기 없다 — 평가 러너는 실제 LLM 을 호출해 크레딧을 쓰므로 CI 에서 돌면
# 안 된다. 러너는 손으로 실행하고, 그 안의 순수 함수와 동결 스냅샷만 `tests/` 에서 잰다.
testpaths = ["tests"]
# editable 설치(.pth)가 풀려도 테스트는 돌아야 한다 — 실제로 로컬에서 간헐적으로 풀렸다.
# src 레이아웃을 직접 가리켜 `uv sync` 상태와 무관하게 같은 결과가 나오게 한다.
# `"."` 는 `tests/` 가 `evals` 를 import 하기 위한 것이다(evals 는 설치 대상이 아니다).
pythonpath = ["src", "."]
