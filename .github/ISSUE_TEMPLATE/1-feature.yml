name: 기능
description: 새 기능을 추가한다
title: "[feat] "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        브랜치는 이슈 번호를 앞에 붙여 판다 — `feat/<이슈번호>-<내용>`.
        규칙 전문은 [CONTRIBUTING.md](../blob/dev/CONTRIBUTING.md).

  - type: textarea
    id: what
    attributes:
      label: 📝 작업 내용
      description: 구체적으로 뭘 할 건지 항목별로.
      placeholder: |
        - 로그인 화면에 카카오 버튼 추가
        - POST /auth/kakao 연동
        - 실패 시 문구 매핑
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 📣 참고사항
      description: 관련 링크, 의존 이슈, 주의할 점. 해당하는 `specs/` 문서가 있으면 여기에.
      placeholder: |
        - 스펙: specs/0007-온보딩.md
        - #12 가 먼저 머지돼야 한다

  - type: checkboxes
    id: checklist
    attributes:
      label: ☑️ 체크리스트
      options:
        - label: 담당자, 라벨 설정했나요?
        - label: 브랜치명이 규칙(`feat/이슈번호-내용`)에 맞는지 확인했나요?
