name: 버그
description: 동작이 잘못됐다
title: "[fix] "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        운영에 급한 버그여도 **순서를 건너뛰지 않는다** — `dev` 에서 브랜치를 따고
        `dev` PR → `main` PR 로 간다. `main` 에 직접 push 하지 않는다.

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 1, 2, 3 으로. 재현이 안 되면 그 사실도 적는다.
      placeholder: |
        1. 방 상세 → 아카이브 탭
        2. 링크 자료를 길게 누른다
        3. 삭제를 누른다
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 로그·스크린샷·에러 메시지를 붙인다. **"안 돼요" 만으로는 못 고친다.**
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 📣 환경
      description: 어디서 났는지. 서버면 배포 시각·색(blue/green)까지.
      placeholder: |
        - iOS 18.2 실기기 / 앱 1.0.0(4)
        - 서버 2026-08-15 14:20 배포 후

  - type: checkboxes
    id: checklist
    attributes:
      label: ☑️ 체크리스트
      options:
        - label: 담당자, 라벨 설정했나요?
        - label: 브랜치명이 규칙(`feat/이슈번호-내용`)에 맞는지 확인했나요?
