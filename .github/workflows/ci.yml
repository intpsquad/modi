# CI/CD — 2026-08-13 에 Jenkins(저장소 루트 Jenkinsfile, 497줄)를 대체했다.
#
# **왜 워크플로를 여러 파일로 쪼개지 않았나**: Jenkins 는 한 파이프라인의 스테이지라서
# "테스트가 통과해야 배포가 돈다"가 공짜였다. 워크플로를 파일로 쪼개면 그 게이팅이
# 사라진다 — deploy 워크플로가 테스트 결과를 모른 채 main push 만 보고 배포한다.
# `workflow_run` 으로 묶는 방법도 있지만, 경로 필터로 스킵된 워크플로는 애초에
# 실행되지 않아 트리거가 오지 않는다. 그래서 잡을 한 파일에 두고 `needs` 로 묶는다.
# (예외: 배포와 무관한 예약 감시 instagram-doc-id.yml 은 별도 파일이다 — 이 사슬에 끼지 않고,
#  여기에 schedule 을 얹으면 paths-filter 가 schedule 이벤트에서 base 를 못 잡는다. 2026-08-22)
#
# 옛 Jenkinsfile 의 스테이지 대응:
#   detect changed paths      → changes 잡 (dorny/paths-filter)
#   app: analyze & test       → app 잡
#   server: build & test      → server 잡
#   ai: lint & test           → ai 잡
#   deploy                    → deploy 잡
#   app: shorebird patch      → **제거**(2026-08-13, iOS 전용화로 안드로이드 릴리스 경로 없음)
#   iOS: TestFlight           → **옮기지 않음**. Mac 에서 사람이 돌린다(docs/ios-release.md).
#                                프라이빗 저장소의 macOS 러너는 분수를 10배로 소모한다.
#                                ⚠️ 2026-08-15 에 저장소를 공개로 돌리면서 **이 이유는 사라졌다**
#                                (공개 저장소는 Actions 가 무료). 아직 옮기지 않았을 뿐이다.
name: CI

# 🔴 **배포를 태우는 브랜치는 `main` 이다**(2026-08-15 변경, 그전에는 `dev`).
# `dev` push 는 테스트만 돌고 배포하지 않는다. 브랜치별 역할은 CONTRIBUTING.md.
# (`master` 를 트리거에서 뺐다 — 이 저장소에 존재한 적이 없는 브랜치였다.)
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 경로 필터를 무시하고 전부 돌린다 (옛 Jenkinsfile 의 FORCE_ALL)
        type: boolean
        default: false

# 같은 브랜치에 연속 push 가 오면 앞의 실행을 취소한다. 단 배포가 섞이면 위험하므로
# main 은 취소하지 않는다 — 배포 도중 취소되면 컨테이너가 중간 상태로 남는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 🔴 `pull-requests: read` 가 있어야 PR 에서 CI 가 돈다. `dorny/paths-filter` 는 이벤트에 따라
# 바뀐 파일을 찾는 방법이 다르다 — push 는 git diff, **PR 은 GitHub API(`listFiles`)** 다.
# 권한이 없으면 `changes` 잡이 `Resource not accessible by integration` 으로 죽고, 뒤따르는
# 잡이 전부 스킵돼 **PR 이 통째로 실패한다.**
# 2026-08-15 이 저장소의 **첫 PR(#2)** 에서 드러났다. 그전 실행은 전부 `dev` push 라
# API 경로를 한 번도 타지 않았다.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 🔴 **이 줄이 없으면 `main` push 에서 테스트 잡이 영영 스킵된다.**
          # `base` 를 안 주면 paths-filter 는 **저장소 기본 브랜치**(= `dev`)와 비교하는데,
          # `main` 은 방금 `dev` 를 머지한 참이라 그 차이가 **항상 빈 목록**이다. 그러면
          # app/server/ai 가 스킵되고, `deploy` 는 "스킵은 통과" 규칙이라 **검사 없이 배포된다.**
          # `github.ref_name` 을 주면 "같은 브랜치면 직전 커밋과 비교" 규칙이 걸린다.
          # `pull_request` 이벤트에서는 이 옵션이 무시되므로 PR 경로는 영향받지 않는다.
          # 2026-08-15 첫 main 배포(run 31827746462)에서 실측으로 드러났다.
          base: ${{ github.ref_name }}
          filters: |
            app:
              - 'app/**'
              # 웹 약관 페이지도 app 잡이 검사한다(legal_web_sync_test.dart 가 앱 본문과 대조).
              # **이 줄이 없으면 가드가 한쪽으로만 걸린다** — `legal_content.dart` 를 고치면
              # 잡히지만 `deploy/site/*.html` 만 고치면 잡이 아예 안 돌아 그냥 통과한다.
              # 하필 Apple 이 읽는 것은 웹 쪽이라 그 방향이 더 위험하다.
              - 'deploy/site/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'docs/api/openapi.json'
              - '.github/workflows/ci.yml'
            ai:
              - 'ai/**'
              - '.github/workflows/ci.yml'

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true' || inputs.force_all
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 🔴 **app/.fvmrc 와 같은 값이어야 한다.** 어긋나면 `dart format --set-exit-if-changed` 가
          # **로컬은 통과하고 CI 만 실패할 수 있다** — 포맷터 출력이 버전마다 달라서다.
          # 2026-08-13 에 이 값(3.44.7)이 개발 머신(3.44.8)과 어긋나 있는 것을 발견해 맞췄다.
          # (그때 CI 실패의 원인은 이것이 아니라 빈 시크릿이었다 — 아래 deploy 잡 참고. 다만
          #  어긋난 핀은 언제든 터질 잠재 결함이라 함께 고쳤다.)
          # 3.44.0 은 Dart 3.12.0 이라 app/pubspec.yaml 의 `sdk: ^3.12.2` 를 만족하지 못한다.
          flutter-version: 3.44.8
          channel: stable
          cache: true
      # lib/firebase_options.dart 는 실제 Firebase 키가 들어 있어 커밋하지 않는다
      # (.gitignore, README "로컬 전용 파일"). 그런데 main.dart 가 이걸 import 하므로
      # 없으면 flutter analyze 가 "Target of URI doesn't exist" 로 깨진다.
      # analyze/test 는 앱을 실행하지 않아 실제 키가 필요 없으므로 템플릿을 복사한다.
      - name: firebase_options 템플릿 채우기
        run: '[ -f lib/firebase_options.dart ] || cp lib/firebase_options.example.dart lib/firebase_options.dart'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true' || inputs.force_all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # SchemaValidationTest·RoomServiceTest 가 Testcontainers 로 Postgres·Redis 를 띄운다.
      # ubuntu-latest 러너에는 Docker 가 이미 있고 잡이 러너 호스트에서 직접 돌기 때문에,
      # 옛 Jenkins 처럼 docker.sock 마운트나 --network host 를 맞춰줄 필요가 없다.
      - name: 빌드 + 테스트
        run: ./gradlew build
        working-directory: server
      # OpenApiExportTest 가 테스트 중 docs/api/openapi.json 을 재생성한다.
      # 컨트롤러를 바꾸고 이 파일을 커밋하지 않았다면 여기서 실패한다 —
      # CLAUDE.md "문서 자동화" 의 드리프트 방지 장치다.
      - name: OpenAPI 드리프트 검사
        run: git diff --exit-code -- docs/api/openapi.json

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || inputs.force_all
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # **ai/Dockerfile 과 같은 버전을 유지할 것** — CI 와 운영이 갈리면 안 된다.
          version: 0.11.26
          python-version: '3.12'
          enable-cache: true
      # --frozen: uv.lock 을 갱신하지 않고 그대로 쓴다. pyproject.toml 을 고치고 lock 을
      # 커밋하지 않았다면 여기서 실패한다(server 잡의 openapi.json 검사와 같은 의도).
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  # 🔴 **브랜치 보호가 요구할 단 하나의 상태 체크.** `app`/`server`/`ai` 를 직접 필수로 걸면
  # 안 된다 — 경로 필터로 **스킵된** 잡을 필수 체크로 지정하면 PR 이 영구히 머지 대기에
  # 걸릴 위험이 있다(문서만 고친 PR 은 세 잡이 다 스킵된다). 아래 조건은 `deploy` 잡이 이미
  # 쓰는 것과 같다: 스킵은 통과로 보고 **실패만** 막는다.
  #
  # 설정: GitHub → Settings → Rules/Branches → **`main` 과 `dev` 둘 다** → Require status checks
  # → **`gate` 만** 선택. ⚠️ 체크 목록에는 **한 번 돌아본 뒤에야** 나타난다. 첫 push 뒤에 설정할 것.
  gate:
    needs: [app, server, ai]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - run: echo "app/server/ai 잡 중 실패한 것이 없다."

  deploy:
    needs: [changes, app, server, ai]
    # `always() && !failure() && !cancelled()` 이어야 한다. 경로 필터로 스킵된 잡은
    # 결과가 skipped 인데, 기본 동작은 **의존 잡이 스킵되면 이쪽도 스킵**이다 —
    # 그러면 문서만 고친 커밋이 영영 배포되지 않는다. 실패했을 때만 막는 것이 의도다.
    #
    # `workflow_dispatch` 도 허용한다(2026-08-13). 이유 둘: ① 서버에서 손으로 `git pull` 을
    # 할 수 없게 됐으므로(아래 참고) "최신 코드로 재배포"의 사람용 수단이 필요하다
    # ② push 없이 SSH 배선을 시험할 수 있다. 수동 실행에서는 경로 필터가 변화를 못 잡아
    # 테스트 잡이 스킵될 수 있는데, 그건 이미 통과한 코드를 다시 배포하는 것이라 괜찮다
    # (전부 다시 돌리려면 실행 시 `force_all` 을 켠다).
    #
    # 🔴 **`main` 이다**(2026-08-15, 그전에는 `dev`). `dev` 에 머지해도 서버는 바뀌지 않는다.
    # 수동 재배포·롤백도 `main` 을 골라 Run workflow 해야 이 조건을 통과한다.
    # 이 게이트가 **포크 PR 이 배포를 태우지 못하게** 하는 장치이기도 하다(저장소가 공개다) —
    # `push`/`workflow_dispatch` 만 허용하므로 `pull_request` 이벤트로는 절대 실행되지 않는다.
    if: |
      always() && !failure() && !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # 🔴 **소스는 러너가 서버로 밀어 넣는다**(2026-08-13 변경). 예전에는 서버가 GitHub 에서
      # 직접 `git fetch` 했는데, 그러려면 서버에 읽기 전용 deploy key 가 필요했다. 그런데
      # 이 오가니제이션은 **정책으로 deploy key 를 금지**한다(화면 문구 `Disabled by <org>`;
      # 확인 시점 2026-08-13 의 org 이름은 modintps, 2026-08-14에 intpsquad 로 개명).
      #
      # 방향을 뒤집어서 얻은 것: **서버에 GitHub 자격증명이 아예 필요 없다.** org 정책을
      # 약하게 만들지 않아도 되고, "서버가 이 저장소를 상시 읽을 수 있는 상태" 자체가 사라졌다.
      #
      # 대가: 서버에서 `git pull` 로 최신 코드를 받을 수 없다. 사람이 최신 코드로 배포하려면
      # Actions → CI → Run workflow 를 쓴다(위 workflow_dispatch 허용이 그 용도다).
      # 서버에 이미 있는 코드로 다시 배포하는 것은 `./deploy/deploy.sh` 만 돌리면 된다.
      #
      # **빌드는 여전히 서버(ARM)에서 한다.** 러너(x86_64)에서 만든 이미지는 오라클 A1 에서 못 뜬다.
      - uses: actions/checkout@v4
      # 🔴 시크릿이 비어 있을 때 **명확히 실패**시킨다. 없으면 rsync 가
      #   "ssh: Could not resolve hostname : Name or service not known" + exit 255
      # 로 죽는데, 호스트명이 빈 문자열이라는 걸 알아채기 어렵다(2026-08-13 첫 배포가 그랬다).
      #
      # ⚠️ **가장 흔한 원인**: Organization secrets 쪽에 넣은 것. GitHub 이 그 화면에 직접
      # 써 두었듯이 org secrets 는 이 플랜에서 **프라이빗 저장소에 쓸 수 없다** — 값이 조용히
      # 빈 문자열로 들어온다. 반드시 **Repository secrets** 에 넣어야 한다.
      - name: 배포 시크릿 확인
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          for n in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            [ -n "${!n:-}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::배포 시크릿이 비어 있다:$missing"
            echo "Settings → Secrets and variables → Actions → **Repository secrets** 에 넣을 것."
            echo "org secrets 는 프라이빗 저장소에서 안 쓰인다(값이 빈 문자열로 온다)."
            exit 1
          fi
          # 비밀키는 armor 줄이 빠지면 러너에서 'error in libcrypto' 로 죽는다. 미리 잡는다.
          case "$SSH_PRIVATE_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*) : ;;
            *) echo "::error::SSH_PRIVATE_KEY 에 '-----BEGIN OPENSSH PRIVATE KEY-----' 줄이 없다."
               echo '서버에서 `cat ~/.ssh/github_actions_deploy` 출력을 **첫 줄부터 마지막 줄까지** 넣을 것.'
               exit 1 ;;
          esac
          echo "시크릿 4개 확인됨 (host=${SSH_HOST:0:3}… user=$SSH_USER)"
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 호스트 키를 시크릿으로 고정한다. StrictHostKeyChecking=no 로 열어두면
          # 중간자에게 배포 명령과 서버 접근을 그대로 넘겨주는 셈이 된다.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      # 🔴 rsync 는 **양쪽에** 있어야 한다. 서버에 없으면
      #   bash: line 1: rsync: command not found
      #   rsync error: remote command not found (code 127)
      # 로 죽는데, 어느 쪽이 없는 건지 메시지만 보고는 헷갈린다(2026-08-13 실제로 그랬다 —
      # 오라클 Ubuntu 최소 이미지에 rsync 가 안 깔려 있다).
      - name: 서버에 rsync 가 있는지 확인
        run: |
          if ! ssh -o StrictHostKeyChecking=yes                  "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'command -v rsync' >/dev/null; then
            echo "::error::서버에 rsync 가 없다. 서버에서 1회: sudo apt-get install -y rsync"
            exit 1
          fi
      # `--delete` 로 저장소에서 지워진 파일이 서버에 남지 않게 한다. 운영 `.env` 와
      # `active-upstream.conf` 는 **저장소 밖**(`~/maramodi/`)에 있어 이 동기화가 건드리지 않는다.
      #
      # `-a` 가 mtime 을 보존하는 것이 중요하다 — 안 그러면 매 배포마다 Docker 빌드 캐시가
      # 전부 무효화돼 ARM 4코어에서 빌드가 몇 분씩 길어진다.
      #
      # `.git` 도 함께 보낸다(checkout 이 shallow 라 작다). deploy.sh 가 배포 대상 커밋을
      # 찍는 데 쓰고, 서버에서 `git log`·`git status` 로 확인할 수 있다.
      - name: 서버로 소스 동기화
        run: |
          rsync -az --delete \
            -e 'ssh -o StrictHostKeyChecking=yes' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:maramodi/repo/"
      - name: 배포
        run: |
          ssh -o StrictHostKeyChecking=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'set -euo pipefail
               cd ~/maramodi/repo
               ./deploy/deploy.sh'
